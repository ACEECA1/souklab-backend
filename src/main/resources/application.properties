spring.application.name=souklab
server.port=${PORT:8080}
spring.config.import=optional:file:.env[.properties]

# Database Configuration (MySQL)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/souklab_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=${JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# JWT Security
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.access-token-expiration-ms=${APP_JWT_ACCESS_EXP:3600000}
app.jwt.refresh-token-expiration-ms=${APP_JWT_REFRESH_EXP:86400000}

# Hibernate Search & Elasticsearch
spring.jpa.properties.hibernate.search.backend.type=elasticsearch
spring.jpa.properties.hibernate.search.backend.uris=${ELASTICSEARCH_URIS:http://localhost:9200}
spring.jpa.properties.hibernate.search.backend.username=${ELASTICSEARCH_USERNAME:}
spring.jpa.properties.hibernate.search.backend.password=${ELASTICSEARCH_PASSWORD:}
spring.jpa.properties.hibernate.search.schema_management.strategy=${HIBERNATE_SEARCH_SCHEMA_MANAGEMENT:none}

# File Upload & Storage Locations
app.storage.upload-dir=${APP_STORAGE_UPLOADS:storage/uploads}
app.storage.thumbnails=${APP_STORAGE_THUMBNAILS:storage/thumbnails}
app.storage.indexes=${APP_STORAGE_INDEXES:storage/indexes}
app.file.upload-dir=${app.storage.upload-dir}
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# ClamAV Virus Scanning
app.virus-scan.enabled=${APP_VIRUS_SCAN_ENABLED:false}
app.virus-scan.host=${APP_VIRUS_SCAN_HOST:localhost}
app.virus-scan.port=${APP_VIRUS_SCAN_PORT:3310}

# Mail Configuration (SMTP / MailerSend)
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
app.email.use-smtp=${APP_EMAIL_USE_SMTP:true}
app.mailersend.api-key=${MAILERSEND_API_KEY:}
app.mailersend.sender-email=${MAILERSEND_SENDER_EMAIL:noreply@souklab.dz}
app.mailersend.sender-name=${MAILERSEND_SENDER_NAME:Souklab}

# Chargily Pay V2 Integration
app.chargily.api-key=${CHARGILY_API_KEY:}
app.chargily.secret-key=${CHARGILY_SECRET_KEY:}
app.chargily.mode=${CHARGILY_MODE:test}
app.chargily.webhook-secret=${CHARGILY_WEBHOOK_SECRET:}

# Admin Seed Account
app.admin.default-password=${APP_ADMIN_DEFAULT_PASSWORD:admin123}

# CORS Configuration
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Logging Levels (TRACE, DEBUG, INFO, WARN, ERROR)
logging.level.root=${APP_LOGGING_LEVEL_ROOT:INFO}
logging.level.com.project.souklab=${APP_LOGGING_LEVEL_APP:DEBUG}
logging.level.org.hibernate.search=${APP_LOGGING_LEVEL_SEARCH:INFO}
logging.level.org.hibernate.search.backend.elasticsearch.request=${APP_LOGGING_LEVEL_SEARCH_REQUESTS:DEBUG}
logging.level.org.hibernate.search.backend.elasticsearch.client.rest.request=${APP_LOGGING_LEVEL_SEARCH_REQUESTS:DEBUG}
logging.level.org.elasticsearch.client=${APP_LOGGING_LEVEL_ELASTICSEARCH:INFO}
